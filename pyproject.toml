[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carve-decision"
version = "0.1.0"
description = "Open-source Jev-like model family using one-token Qwen3.8 candidate-logit readout"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Rudransh Agnihotri" }]
keywords = [
  "decision-model",
  "jev",
  "open-source",
  "qwen",
  "system-one",
  "typesafe",
  "vllm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "transformers>=5.8,<6",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/rudransh2004/carve-jev"
Documentation = "https://github.com/rudransh2004/carve-jev#readme"
Issues = "https://github.com/rudransh2004/carve-jev/issues"
Source = "https://github.com/rudransh2004/carve-jev"

[project.optional-dependencies]
benchmark = ["numpy>=2,<3"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
  "typesafe-sdk>=0.7.1,<0.8",
]

[project.scripts]
carve-server = "carve.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
