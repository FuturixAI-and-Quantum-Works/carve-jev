name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal request with secrets and private data removed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: CARVE, Python, vLLM, model revision, GPU, and driver versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
